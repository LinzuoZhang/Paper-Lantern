<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Moonlight Paper Reader</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="libraryView" class="library-view" aria-label="Literature library">
      <header class="library-header">
        <div>
          <h1>Literature Library</h1>
          <p id="libraryRoot">Manage papers, PDFs, highlights, and method notes by folder.</p>
        </div>
        <form id="uploadForm" class="upload-form">
          <div class="upload-menu-wrap">
            <button id="uploadMenuButton" class="file-button menu-button" type="button" aria-haspopup="menu" aria-expanded="false">
              <span class="upload-button-text">
                <span>Upload PDF</span>
                <small>Click, drop, or import arXiv</small>
              </span>
              <span class="upload-button-chevron" aria-hidden="true"></span>
            </button>
            <div id="uploadMenu" class="upload-menu library-menu" role="menu" hidden>
              <label class="upload-menu-item" role="menuitem">
                <input id="libraryPdfInput" name="pdf" type="file" accept="application/pdf" />
                <span class="upload-menu-icon upload-menu-icon-file" aria-hidden="true"></span>
                <span>
                  <strong>Drag or click upload</strong>
                  <small>Choose a local PDF, or drop it here</small>
                </span>
              </label>
              <button id="arxivUploadButton" type="button" role="menuitem">
                <span class="upload-menu-icon upload-menu-icon-arxiv" aria-hidden="true">ar</span>
                <span>
                  <strong>arXiv upload</strong>
                  <small>Enter an arXiv ID or URL</small>
                </span>
              </button>
            </div>
          </div>
        </form>
      </header>
      <div class="library-layout">
        <aside class="category-panel">
          <h2>Categories</h2>
          <label class="category-search">
            <span>Search</span>
            <input id="librarySearchInput" type="search" placeholder="Search title or category" autocomplete="off" />
          </label>
          <div id="categoryTree" class="category-tree"></div>
        </aside>
        <section class="paper-list-panel">
          <div class="paper-list-header">
            <h2 id="currentCategoryName">All Papers</h2>
            <p id="libraryStatus" role="status"></p>
          </div>
          <div id="paperList" class="paper-list"></div>
        </section>
      </div>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
