<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaperLantern Paper Reader</title>
    <link rel="icon" type="image/jpeg" href="./.cache/figure.jpg" />
    <link rel="apple-touch-icon" href="./.cache/figure.jpg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="libraryView" class="library-view" aria-label="Literature library">
      <div class="library-layout">
        <aside class="category-panel">
          <div class="brand-lockup library-brand">
            <img class="site-logo" src="./.cache/figure.jpg" alt="" aria-hidden="true" />
            <div>
              <h1>Paper Lantern</h1>
              <p id="libraryRoot" hidden></p>
            </div>
          </div>
          <label class="category-search">
            <span>Search</span>
            <input id="librarySearchInput" type="search" placeholder="Search title or category" autocomplete="off" />
          </label>
          <div id="categoryTree" class="category-tree"></div>
          <div class="library-footer-actions">
            <button id="settingsButton" class="settings-trigger" type="button" aria-label="Settings" title="Settings">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5z" />
                <path d="M19.4 15a1.8 1.8 0 0 0 .36 2l.06.06a2.1 2.1 0 0 1-2.97 2.97l-.06-.06a1.8 1.8 0 0 0-2-.36 1.8 1.8 0 0 0-1.1 1.65V21.5a2.1 2.1 0 0 1-4.2 0v-.09a1.8 1.8 0 0 0-1.1-1.65 1.8 1.8 0 0 0-2 .36l-.06.06a2.1 2.1 0 0 1-2.97-2.97l.06-.06a1.8 1.8 0 0 0 .36-2 1.8 1.8 0 0 0-1.65-1.1H2a2.1 2.1 0 0 1 0-4.2h.09a1.8 1.8 0 0 0 1.65-1.1 1.8 1.8 0 0 0-.36-2l-.06-.06a2.1 2.1 0 0 1 2.97-2.97l.06.06a1.8 1.8 0 0 0 2 .36 1.8 1.8 0 0 0 1.1-1.65V2.4a2.1 2.1 0 0 1 4.2 0v.09a1.8 1.8 0 0 0 1.1 1.65 1.8 1.8 0 0 0 2-.36l.06-.06a2.1 2.1 0 0 1 2.97 2.97l-.06.06a1.8 1.8 0 0 0-.36 2 1.8 1.8 0 0 0 1.65 1.1H22a2.1 2.1 0 0 1 0 4.2h-.09A1.8 1.8 0 0 0 19.4 15z" />
              </svg>
              <small id="cloudSyncStatus" hidden>Checking...</small>
            </button>
            <button id="cloudSyncButton" class="sync-refresh-button" type="button" aria-label="Sync library" title="Sync library">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8.1 8.1 0 0 0-15.5-2" />
                <path d="M4 5v4h4" />
                <path d="M4 13a8.1 8.1 0 0 0 15.5 2" />
                <path d="M20 19v-4h-4" />
              </svg>
            </button>
          </div>
        </aside>
        <section class="paper-list-panel">
          <div class="paper-list-header">
            <div>
              <h2 id="currentCategoryName">All Papers</h2>
              <p id="libraryStatus" role="status"></p>
            </div>
            <form id="uploadForm" class="upload-form">
              <div class="upload-menu-wrap">
                <button id="uploadMenuButton" class="file-button menu-button" type="button" aria-haspopup="menu" aria-expanded="false">
                  <svg class="upload-button-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3v12" />
                    <path d="m7 8 5-5 5 5" />
                    <path d="M5 15v4h14v-4" />
                  </svg>
                </button>
                <div id="uploadMenu" class="upload-menu" role="menu" hidden>
                  <label class="upload-drop-option" role="menuitem">
                    <input id="libraryPdfInput" name="pdf" type="file" accept="application/pdf" />
                    <span class="upload-drop-box">
                      <svg class="upload-drop-arrow" viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M24 34V12" />
                        <path d="m14 22 10-10 10 10" />
                        <path d="M12 36h24" />
                      </svg>
                      <strong>Upload PDF</strong>
                      <small>Drop a file here or click to choose</small>
                    </span>
                  </label>
                  <div class="arxiv-upload-panel" role="menuitem">
                    <label for="arxivUploadInput">arXiv ID or URL</label>
                    <div class="arxiv-upload-row">
                      <input id="arxivUploadInput" type="text" placeholder="2401.12345 or arxiv.org/abs/..." autocomplete="off" />
                      <button id="arxivUploadButton" type="button">Upload</button>
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div id="paperList" class="paper-list"></div>
        </section>
        <aside id="paperInfoPanel" class="paper-info-panel" aria-label="Paper information" hidden></aside>
      </div>
    </main>
    <div id="cloudConfigOverlay" class="cloud-config-overlay" hidden>
      <form id="cloudConfigForm" class="cloud-config-card">
        <div class="cloud-config-header">
          <h2>Settings</h2>
          <button id="cloudConfigCloseButton" class="drawer-close-button" type="button" aria-label="Close"></button>
        </div>
        <div class="settings-section-title">AI API</div>
        <label>
          <span>API Base URL</span>
          <input id="aiBaseUrlInput" type="url" placeholder="https://api.openai.com/v1" />
        </label>
        <label>
          <span>Model</span>
          <input id="aiModelInput" type="text" placeholder="gpt-4o-mini" />
        </label>
        <label>
          <span>API Key</span>
          <input id="aiApiKeyInput" type="password" autocomplete="new-password" placeholder="Leave blank to keep existing key" />
        </label>
        <div class="ai-api-test-row">
          <button id="aiApiTestButton" class="secondary-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5h8" />
              <path d="M12 5v5" />
              <path d="M9 10h6l4 8a2 2 0 0 1-1.8 3H6.8A2 2 0 0 1 5 18l4-8z" />
            </svg>
            <span>Test API</span>
          </button>
          <p id="aiApiTestStatus" class="ai-api-test-status" role="status"></p>
        </div>
        <div class="settings-section-title">Cloud Sync</div>
        <label>
          <span>Sync Provider</span>
          <select id="cloudProviderSelect">
            <option value="local">Google Drive / local sync folder</option>
            <option value="webdav">Jianguoyun / WebDAV</option>
          </select>
        </label>
        <label>
          <span>Local Sync Folder</span>
          <input id="cloudLocalDirInput" type="text" placeholder="C:\Users\you\Google Drive\PaperLantern" />
        </label>
        <label>
          <span>WebDAV URL</span>
          <input id="cloudWebdavUrlInput" type="url" placeholder="https://dav.jianguoyun.com/dav/PaperLantern" />
        </label>
        <label>
          <span>Account</span>
          <input id="cloudUsernameInput" type="text" autocomplete="username" />
        </label>
        <label>
          <span>Password / App Password</span>
          <input id="cloudPasswordInput" type="password" autocomplete="new-password" placeholder="Leave blank to keep existing password" />
        </label>
        <label class="cloud-auto-sync-row">
          <input id="cloudAutoPushInput" type="checkbox" />
          <span>Auto sync after library changes</span>
        </label>
        <button type="submit">Save Settings</button>
      </form>
    </div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
