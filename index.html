<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文献库 - Paper Lantern</title>
    <link rel="icon" type="image/jpeg" href="./assets/figure.jpg" />
    <link rel="apple-touch-icon" href="./assets/figure.jpg" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <link rel="stylesheet" href="./assets/css/workspace.css" />
    <link rel="stylesheet" href="./assets/css/note.css" />
    <link rel="stylesheet" href="./assets/css/library.css" />
    <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="./vendor/markdown-it-texmath/css/texmath.min.css" />
    <link rel="stylesheet" href="./assets/css/research_assistant.css" />
  </head>
  <body class="workspace-page library-page">
    <main id="libraryView" class="library-view" aria-label="Literature library">
      <div class="library-layout">
        <aside class="category-panel">
          <div class="brand-lockup library-brand">
            <img class="site-logo" src="./assets/figure.jpg" alt="" aria-hidden="true" />
            <div>
              <h1>Paper Lantern</h1>
              <p id="libraryRoot" hidden></p>
            </div>
          </div>
          <div id="categoryTree" class="category-tree">
            <div id="categoryTopRows"></div>
            <div id="categoryMainRows"></div>
          </div>
          <div class="library-footer-actions">
            <button id="settingsButton" class="settings-trigger" type="button" aria-label="设置" title="设置">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5z" />
                <path d="M19.4 15a1.8 1.8 0 0 0 .36 2l.06.06a2.1 2.1 0 0 1-2.97 2.97l-.06-.06a1.8 1.8 0 0 0-2-.36 1.8 1.8 0 0 0-1.1 1.65V21.5a2.1 2.1 0 0 1-4.2 0v-.09a1.8 1.8 0 0 0-1.1-1.65 1.8 1.8 0 0 0-2 .36l-.06.06a2.1 2.1 0 0 1-2.97-2.97l.06-.06a1.8 1.8 0 0 0 .36-2 1.8 1.8 0 0 0-1.65-1.1H2a2.1 2.1 0 0 1 0-4.2h.09a1.8 1.8 0 0 0 1.65-1.1 1.8 1.8 0 0 0-.36-2l-.06-.06a2.1 2.1 0 0 1 2.97-2.97l.06.06a1.8 1.8 0 0 0 2 .36 1.8 1.8 0 0 0 1.1-1.65V2.4a2.1 2.1 0 0 1 4.2 0v.09a1.8 1.8 0 0 0 1.1 1.65 1.8 1.8 0 0 0 2-.36l.06-.06a2.1 2.1 0 0 1 2.97 2.97l-.06.06a1.8 1.8 0 0 0-.36 2 1.8 1.8 0 0 0 1.65 1.1H22a2.1 2.1 0 0 1 0 4.2h-.09A1.8 1.8 0 0 0 19.4 15z" />
              </svg>
              <small id="cloudSyncStatus" hidden>Checking...</small>
            </button>
            <button id="cloudSyncButton" class="sync-refresh-button" type="button" aria-label="同步文献库" title="同步文献库">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8.1 8.1 0 0 0-15.5-2" />
                <path d="M4 5v4h4" />
                <path d="M4 13a8.1 8.1 0 0 0 15.5 2" />
                <path d="M20 19v-4h-4" />
              </svg>
            </button>
          </div>
        </aside>
        <div id="libraryLayoutResizer" class="library-layout-resizer" role="separator" aria-label="调整文献库左右比例" aria-orientation="vertical"></div>
        <section class="paper-list-panel">
          <div class="paper-list-header">
            <div>
              <h2 id="currentCategoryName">文献库</h2>
              <p id="libraryStatus" role="status"></p>
            </div>
            <form id="uploadForm" class="upload-form">
              <label class="category-search">
                <svg class="library-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
                <input id="librarySearchInput" type="search" placeholder="搜索标题、作者或标志" aria-label="按标题、作者、标志或分类搜索文献与笔记" autocomplete="off" />
              </label>
              <button id="createNoteButton" class="file-button library-create-note-button" type="button" aria-label="新建笔记" title="新建笔记">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
              </button>
              <div class="upload-menu-wrap">
                <button id="uploadMenuButton" class="file-button menu-button" type="button" aria-label="上传论文" title="上传论文" aria-haspopup="menu" aria-expanded="false">
                  <svg class="upload-button-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3v12" />
                    <path d="m7 8 5-5 5 5" />
                    <path d="M5 15v4h14v-4" />
                  </svg>
                </button>
                <div id="uploadMenu" class="upload-menu" role="menu" hidden>
                  <label class="upload-drop-option" role="menuitem">
                    <input id="libraryPdfInput" name="pdf" type="file" accept="application/pdf" />
                    <span class="upload-drop-box">
                      <svg class="upload-drop-arrow" viewBox="0 0 48 48" aria-hidden="true">
                        <path d="M24 34V12" />
                        <path d="m14 22 10-10 10 10" />
                        <path d="M12 36h24" />
                      </svg>
                      <strong>上传 PDF</strong>
                      <small>拖拽文件到这里，或点击选择</small>
                    </span>
                  </label>
                  <div class="arxiv-upload-panel" role="menuitem">
                    <label for="arxivUploadInput">PDF URL or arXiv</label>
                    <div class="arxiv-upload-row">
                      <input id="arxivUploadInput" type="url" placeholder="https://example.com/paper.pdf or 2401.12345" autocomplete="off" />
                      <button id="arxivUploadButton" type="button" aria-label="上传" title="上传">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 16V4"></path><path d="m6 9 6-6 6 6"></path><path d="M5 20h14"></path></svg>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div class="paper-list-stage">
            <div id="paperBulkToolbar" class="paper-bulk-toolbar" role="toolbar" aria-label="批量操作" hidden>
              <span id="paperBulkCount" class="paper-bulk-count">已选 0 项</span>
              <button id="paperBulkFlagsButton" class="paper-bulk-action" type="button" aria-haspopup="dialog" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M4 22V3m0 0c6-4 10 4 16 0v12c-6 4-10-4-16 0"></path>
                </svg>
                <span>标志</span>
              </button>
              <button id="paperBulkMoveButton" class="paper-bulk-action menu-button" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                  <path d="M12 13v4"></path>
                  <path d="m9.5 14.5 2.5-2.5 2.5 2.5"></path>
                </svg>
                <span>移动</span>
              </button>
              <button id="paperBulkDeleteButton" class="paper-bulk-action paper-bulk-delete" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M3 6h18"></path>
                  <path d="M8 6V4h8v2"></path>
                  <path d="M6 6l1 15h10l1-15"></path>
                </svg>
                <span>删除</span>
              </button>
            </div>
            <div id="paperList" class="paper-list"></div>
          </div>
        </section>
        <div id="paperInfoResizer" class="paper-info-resizer" role="separator" aria-label="Resize paper information panel" aria-orientation="vertical"></div>
        <aside id="paperInfoPanel" class="paper-info-panel" aria-label="Paper information"></aside>
      </div>
    </main>
    <div id="libCitationOverlay" class="citation-overlay" hidden>
      <div class="citation-overlay-card">
        <div class="citation-overlay-header">
          <h2 id="libCitationOverlayTitle">引用信息</h2>
          <button id="libCitationOverlayCloseButton" class="drawer-close-button" type="button" aria-label="关闭"></button>
        </div>
        <p id="libCitationOverlayMeta" class="citation-overlay-meta"></p>
        <div class="citation-overlay-toolbar">
          <select id="libCitationFormatSelect" class="citation-format-select" aria-label="引用格式">
            <option value="gbt7714">GB/T 7714</option>
            <option value="bibtex">BibTeX</option>
            <option value="ris">RIS</option>
            <option value="apa">APA</option>
            <option value="mla">MLA</option>
            <option value="ieee">IEEE</option>
          </select>
          <button id="libCitationCopyButton" class="icon-button copy-section-button" type="button" aria-label="复制引用" title="复制引用">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
        <textarea id="libCitationOutput" class="citation-output" readonly spellcheck="false" aria-label="引用结果"></textarea>
      </div>
    </div>
    <button id="researchLauncher" class="research-launcher" type="button" aria-label="打开阅读助手" aria-controls="researchPanel" aria-expanded="false" title="阅读助手">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7.1V4.7" stroke-width="1.9"/>
          <circle cx="12" cy="3.3" r="1.4" fill="currentColor" stroke="none"/>
          <rect x="4.1" y="7.1" width="15.8" height="11.4" rx="3.5" stroke-width="1.9"/>
          <path d="M2 11.4v3.2M22 11.4v3.2" stroke-width="1.9"/>
          <circle cx="9" cy="12.2" r="1.3" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="12.2" r="1.3" fill="currentColor" stroke="none"/>
          <path d="M9.6 15.7h4.8" stroke-width="1.9"/>
        </g>
      </svg>
      <span class="research-launcher-dot" aria-hidden="true" hidden></span>
    </button>
    <section id="researchPanel" class="research-panel" role="dialog" aria-modal="false" aria-labelledby="researchTitle" hidden>
      <div id="researchResize" class="research-resize" role="separator" tabindex="0" aria-label="调整阅读助手宽度" aria-orientation="vertical" aria-valuemin="360" aria-valuemax="600" aria-valuenow="420" title="拖动调整宽度，方向键微调"></div>
      <header class="research-panel-header">
        <div class="research-heading"><h2 id="researchTitle">阅读助手</h2><span id="researchScope" class="research-scope">文献库</span></div>
        <div class="research-header-actions">
          <button id="researchHistoryButton" class="research-icon-button" type="button" title="历史会话" aria-label="历史会话" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9M3 4v5h5M12 7v5l3 2"/></svg></button>
          <button id="researchNew" class="research-icon-button" type="button" title="新建会话" aria-label="新建会话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="researchDock" class="research-icon-button" type="button" title="切换为浮窗" aria-label="切换为浮窗"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18m-5-12-3 3 3 3"/></svg></button>
          <button id="researchClose" class="research-icon-button" type="button" aria-label="收起阅读助手" title="收起阅读助手"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
      </header>
      <div id="researchConversationHeader" class="discussion-thread-header research-conversation-header" hidden>
        <button id="researchBack" class="research-icon-button" type="button" title="返回对话列表" aria-label="返回对话列表"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="discussion-thread-title-group"><div id="researchThreadTitle" class="discussion-thread-title">新对话</div><button id="researchTitleEdit" class="research-icon-button discussion-title-edit" type="button" title="重命名对话" aria-label="重命名对话" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button></div>
      </div>
      <div class="research-content-wrap">
      <div id="researchContent" class="research-content" tabindex="0" aria-label="阅读助手内容">
        <div id="researchWelcome" class="research-welcome"><h3>查阅文献，也整理文献库</h3><p>围绕问题查原文、比较方法；分类、标记与笔记修改先列计划，确认后执行。</p>
          <div class="research-suggestions"><button type="button" data-research-prompt="梳理这个研究方向的主要技术路线、代表方法和未解决问题。">梳理研究脉络 <span>↗</span></button><button type="button" data-research-prompt="比较相关文献的方法、实验设置和结论局限，整理成对照表。">比较方法与实验 <span>↗</span></button><button type="button" data-research-prompt="请根据我的研究想法，在当前文献库中寻找相关工作，并说明可借鉴之处：">寻找相关文献 <span>↗</span></button><button type="button" data-research-prompt="查看全库未分类文献，结合标题摘要建议分类，先列出创建分类和归类的具体计划，等我确认后执行。">规划文献整理 <span>↗</span></button></div>
        </div>
        <h3 class="research-history-heading">最近会话</h3>
        <div id="researchThreadList" class="discussion-thread-list" aria-label="研究对话列表"></div>
        <div id="researchMessages" class="research-messages" aria-label="之前的问答" hidden></div>
        <div id="researchQuestion" class="research-question" hidden></div>
        <p id="researchStatus" class="research-status" role="status" aria-live="polite" hidden></p>
        <section id="researchPlan" class="research-plan" aria-label="Agent 执行记录" hidden></section>
        <p id="researchPlanSummary" class="research-execution-summary" hidden></p>
        <div id="researchAnswer" class="research-answer" hidden>
          <article id="researchReport" class="research-report" aria-label="研究报告" hidden></article>
          <div id="researchResultActions" class="research-result-actions" role="group" aria-label="报告操作" hidden>
            <button id="researchCopy" class="research-icon-button" type="button" title="复制报告" aria-label="复制报告" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>
            <button id="researchSave" class="research-icon-button" type="button" title="保存为笔记" aria-label="保存为笔记" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M7 3v6h9V3M7 21v-8h10v8"/></svg></button>
            <a id="researchNote" class="research-icon-button" title="打开笔记" aria-label="打开笔记" hidden target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M14 3h7v7M10 14 21 3"/></svg></a>
          </div>
        </div>
        <button id="researchResume" class="research-resume" type="button" hidden>从检查点继续</button>
      </div>
      <button id="researchScrollBottom" class="research-scroll-bottom" type="button" title="回到底部" aria-label="回到底部" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m7-7-7 7-7-7"/></svg><span>回到底部</span></button>
      </div>
      <form id="researchForm" class="discussion-form research-form">
        <div class="discussion-composer">
          <div id="researchPapers" class="discussion-papers" aria-label="已加入的论文" hidden></div>
          <textarea id="researchTask" rows="1" maxlength="8000" placeholder="输入研究问题或文献库整理任务…" aria-label="研究问题或整理任务" aria-describedby="researchComposeHelp"></textarea>
          <div class="discussion-compose-actions">
            <button id="researchAddPaper" class="add-discussion-paper-button" type="button" aria-label="加入论文" title="加入论文"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button>
            <div class="discussion-send-controls">
              <select id="researchModelSelect" class="discussion-model-select" aria-label="阅读助手模型" aria-describedby="researchModelStatus" title="选择阅读助手模型" disabled><option value="">选择模型</option></select>
              <button id="researchSubmit" class="send-discussion-button" type="submit" aria-label="发送" title="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button>
            </div>
          </div>
          <p id="researchModelStatus" class="discussion-model-status" role="status" aria-live="polite" hidden></p>
        </div>
        <span id="researchComposeHelp" class="research-sr-only">Enter 发送，Shift+Enter 换行；研究中点击发送位置的停止按钮可停止任务。</span>
      </form>
    </section>
    <script src="./vendor/markdown-it/markdown-it.min.js"></script>
    <script src="./vendor/katex/katex.min.js"></script>
    <script src="./vendor/markdown-it-texmath/texmath.min.js"></script>
    <script src="./assets/js/pages/app.js" type="module"></script>
  </body>
</html>
